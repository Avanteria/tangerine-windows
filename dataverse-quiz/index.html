const BANK = [{"id":"q1","topic":0,"question":"What is Microsoft Dataverse primarily designed to provide?","options":["A reporting-only data warehouse","A SharePoint document synchronization engine","A managed business data platform with tables, security and APIs","A desktop-only relational database"],"answer":[2],"why":"The distractors reduce Dataverse to a single workload or a local product.","explain":"Dataverse is a cloud business data platform with relational modeling, security, business logic and integrations.","kind":"single","difficulty":"Foundation"},{"id":"q2","topic":0,"question":"Which Power Platform services commonly use Dataverse as an underlying data source?","options":["Only Power BI semantic models","Power Apps, Power Automate and Dynamics 365 customer engagement apps","Only Azure Virtual Machines","Only Microsoft Excel and Word"],"answer":[1],"why":"The listed alternatives do not describe the main Dataverse application ecosystem.","explain":"Dataverse powers many Power Apps, flows and Dynamics 365 business applications.","kind":"single","difficulty":"Foundation"},{"id":"q3","topic":0,"question":"An environment can have how many Dataverse databases?","options":["Zero or one","Any number selected per solution","Exactly three","One per security role"],"answer":[0],"why":"Solutions and security roles are logical objects, not separate databases per environment.","explain":"A Power Platform environment has zero or one Dataverse database.","kind":"single","difficulty":"Applied"},{"id":"q4","topic":0,"question":"What identifies a Dataverse row uniquely in its table?","options":["A record GUID in the primary ID column","Its business unit name","Its first choice column","A display name"],"answer":[0],"why":"Names and business attributes can be duplicated and do not replace the system primary key.","explain":"Rows use a GUID primary ID; alternate keys can additionally identify rows by business values.","kind":"single","difficulty":"Applied"},{"id":"q5","topic":0,"question":"Which statement best describes a Dataverse table?","options":["It is a Power BI dashboard","It is always an external SQL view","It is a structured collection of rows and typed columns","It is an individual automation run"],"answer":[2],"why":"A table is a data model component, not an automation, external view or report.","explain":"Tables represent business concepts such as Accounts and Contacts through rows and columns.","kind":"single","difficulty":"Advanced"},{"id":"q6","topic":0,"question":"You need separate sandbox and production configurations. What is the cleanest design?","options":["Create two views on the same table","Create separate Power Platform environments","Create different Dataverse tables inside a single production app","Use a different form per environment name"],"answer":[1],"why":"Separate app components or views do not isolate environment data and settings.","explain":"Separate environments provide isolation for development, testing and production deployments.","kind":"single","difficulty":"Foundation"},{"id":"q7","topic":0,"question":"A Dataverse table logical name is intended to provide a stable schema identifier.","options":["True","False"],"answer":[0],"why":"A display label can change without being the stable programmatic schema identifier.","explain":"Logical names identify schema components for development and API use.","kind":"tf","difficulty":"Foundation"},{"id":"q8","topic":0,"question":"Why is using the built-in Account table often preferable to rebuilding it?","options":["It turns every flow into a real-time plug-in","It guarantees unlimited storage","It can reuse standard schema, features and application compatibility","It bypasses user permissions"],"answer":[2],"why":"Reuse does not remove storage, licensing or security requirements.","explain":"Standard tables help align your data model with built-in capabilities and Dynamics 365 integrations.","kind":"single","difficulty":"Applied"},{"id":"q9","topic":0,"question":"Which capability is a first-class Dataverse feature rather than an external add-on?","options":["Excel macro execution","Security roles and row ownership","Windows file sharing permissions","Operating system process scheduling"],"answer":[1],"why":"The other mechanisms are outside the Dataverse table security model.","explain":"Dataverse provides table privileges, access depths, ownership, sharing and team-based access.","kind":"single","difficulty":"Applied"},{"id":"q10","topic":0,"question":"A maker has permission to edit app design but users cannot see rows. What is the first principle to check?","options":["Whether a Power BI dashboard exists","Whether the app icon is SVG","Whether the app was named in English","Whether users have the needed Dataverse data privileges"],"answer":[3],"why":"Maker app access does not automatically imply data access.","explain":"App sharing and Dataverse security are distinct; users still need appropriate table/row permissions.","kind":"single","difficulty":"Advanced"},{"id":"q11","topic":1,"question":"Which table ownership choice supports per-record user or team owners?","options":["Connection reference-owned","Public folder-owned","User/team-owned","Organization-owned"],"answer":[2],"why":"Organization-owned tables do not offer the same record-level ownership model.","explain":"Use user/team ownership when record-level security and ownership assignment are required.","kind":"single","difficulty":"Foundation"},{"id":"q12","topic":1,"question":"Can the ownership type of an existing custom table be freely switched later?","options":["Yes, by editing a view","Yes, by changing its primary column","Yes, by changing the app form","No, it is selected when the table is created"],"answer":[3],"why":"Ownership is fundamental table metadata, not a view/form setting.","explain":"Choose organization or user/team ownership carefully at table creation.","kind":"single","difficulty":"Foundation"},{"id":"q13","topic":1,"question":"Select ALL table types supported by Dataverse in suitable scenarios.","options":["Elastic tables","Standard tables","Virtual tables","Excel cell styles"],"answer":[0,1,2],"why":"A spreadsheet cell style is presentation metadata, not a Dataverse table type.","explain":"Standard, virtual and elastic tables are recognized Dataverse table types.","kind":"multi","difficulty":"Applied"},{"id":"q14","topic":1,"question":"A table reads records from an external system at runtime instead of storing them locally. Which type fits?","options":["Quick view form","Rollup table","Activity table","Virtual table"],"answer":[3],"why":"The alternatives represent activity data, calculations or presentation, not externalized row storage.","explain":"Virtual tables surface external source data through Dataverse without ordinary local row storage.","kind":"single","difficulty":"Applied"},{"id":"q15","topic":1,"question":"Which workload is an elastic table particularly designed for?","options":["Replacing all security roles","Very large-scale datasets with high throughput","Rendering Word documents","Holding only configuration variables"],"answer":[1],"why":"Elastic tables address certain large-scale data workloads, not security or document rendering.","explain":"Elastic tables use Azure Cosmos DB-backed storage for suitable high-volume scenarios.","kind":"single","difficulty":"Advanced"},{"id":"q16","topic":1,"question":"An activity table is most appropriate for which concept?","options":["A telephone call with subject and due date","A single global tax rate","A custom connector definition","A business unit hierarchy root"],"answer":[0],"why":"A telephone call has activity-specific semantics; the other objects do not.","explain":"Activity tables support work items such as tasks, calls and appointments with scheduling fields.","kind":"single","difficulty":"Foundation"},{"id":"q17","topic":1,"question":"Which statement about virtual tables is the safest assumption?","options":["Their operations and capabilities depend on the provider","All providers support the same operations without limitation","They can never appear in model-driven apps","They always store a full duplicate of external rows"],"answer":[0],"why":"Virtual table capabilities vary by provider and do not require full local copies.","explain":"Check provider support for CRUD, relationships, security and features before choosing virtual tables.","kind":"single","difficulty":"Foundation"},{"id":"q18","topic":1,"question":"Dataverse elastic tables are backed by Microsoft Excel worksheets.","options":["True","False"],"answer":[1],"why":"Excel is not the service backing elastic table storage.","explain":"Elastic tables use an Azure Cosmos DB-based implementation.","kind":"tf","difficulty":"Applied"},{"id":"q19","topic":1,"question":"For a table that should be visible to all permitted users without individual row owners, which ownership is generally suitable?","options":["App-user-owned","Custom connector-owned","User/team-owned only","Organization-owned"],"answer":[3],"why":"User/team ownership introduces record ownership that this scenario does not need.","explain":"Organization-owned tables use organization-scope privileges rather than individual record owners.","kind":"single","difficulty":"Applied"},{"id":"q20","topic":1,"question":"Which statement best distinguishes a custom table from a custom column?","options":["A table models a collection of records; a column stores one attribute of each record","A table is always a number; a column is always text","A column can contain multiple environments","A table exists only in flows; a column exists only in apps"],"answer":[0],"why":"The distractors confuse data-model structure with data types or environments.","explain":"Use tables for entities such as Requests and columns for attributes such as Request Date.","kind":"single","difficulty":"Advanced"},{"id":"q21","topic":2,"question":"Which column type provides a controlled single-choice list?","options":["File","Choice","Image only","Lookup only"],"answer":[1],"why":"Files and images hold content, while lookup points to another record.","explain":"Choice columns use a predefined list of allowed option values.","kind":"single","difficulty":"Foundation"},{"id":"q22","topic":2,"question":"Which column type connects a row to another table’s row?","options":["Autonumber","Multiline text","Lookup","Currency"],"answer":[2],"why":"Currency, autonumber and text values do not enforce a record relationship.","explain":"A lookup column stores a reference to a row in a related table.","kind":"single","difficulty":"Foundation"},{"id":"q23","topic":2,"question":"Which are valid Dataverse column types? Select ALL correct answers.","options":["Choice","Lookup","Azure VM instance","File"],"answer":[0,1,3],"why":"An Azure virtual machine is an infrastructure resource, not a Dataverse field type.","explain":"Choice, Lookup and File are supported Dataverse column categories.","kind":"multi","difficulty":"Applied"},{"id":"q24","topic":2,"question":"What does an autonumber column provide?","options":["An automatic approval workflow","Automatically generated formatted identifiers","Automatically assigned security roles","A database backup per row"],"answer":[1],"why":"Autonumber concerns generated values, not backup, authorization or approval.","explain":"Autonumber columns generate identifiers using a defined pattern for newly created rows.","kind":"single","difficulty":"Applied"},{"id":"q25","topic":2,"question":"What is the most fitting choice for calculating a sum over related child rows?","options":["File column","Image column","Rollup column","Primary name column"],"answer":[2],"why":"Other column types do not perform cross-row aggregation.","explain":"Rollup columns aggregate related data and normally refresh asynchronously/periodically.","kind":"single","difficulty":"Advanced"},{"id":"q26","topic":2,"question":"Which statement about rollup columns is correct?","options":["They always recalculate instantly on every keypress","They can aggregate supported related rows on a scheduled basis","They are identical to lookup columns","They automatically grant Read on child rows"],"answer":[1],"why":"Rollup fields are not instant UI formulas and do not grant security privileges.","explain":"Rollup calculations have an asynchronous refresh model and are suited to aggregate values.","kind":"single","difficulty":"Foundation"},{"id":"q27","topic":2,"question":"Dataverse formula columns use which expression language?","options":["DAX measures only","Transact-SQL stored procedures","Python notebooks","Power Fx"],"answer":[3],"why":"SQL, Python and DAX are distinct expression/runtime systems.","explain":"Formula columns use Power Fx with supported functions and data-type limitations.","kind":"single","difficulty":"Foundation"},{"id":"q28","topic":2,"question":"To enforce a conditional business rule on table data for supported operations, which scope is most appropriate?","options":["Specific model-driven form only","Table/entity scope","A navigation pane scope","A dashboard-only scope"],"answer":[1],"why":"Form-only rules do not provide the same table/server applicability.","explain":"Table-scoped business rules can run at the server for supported scenarios, not just one form.","kind":"single","difficulty":"Applied"},{"id":"q29","topic":2,"question":"Dataverse rollup columns always recalculate synchronously on every form keypress.","options":["True","False"],"answer":[1],"why":"Rollup calculation is not guaranteed instant or tied to UI keypresses.","explain":"Rollup values are calculated through scheduled/asynchronous processes.","kind":"tf","difficulty":"Applied"},{"id":"q30","topic":2,"question":"Which data type is appropriate for uploading a PDF to a row as actual file content?","options":["Whole number","Single line of text only","Currency","File column"],"answer":[3],"why":"A text URL or name is not equivalent to storing the document as file content.","explain":"File columns can hold files; use a text/URL column only when storing a reference.","kind":"single","difficulty":"Advanced"},{"id":"q31","topic":3,"question":"An Account can have many Contacts, but each Contact belongs to one Account in this model. Which relationship?","options":["One-to-one only","Many-to-many (N:N)","No relationship","One-to-many (1:N)"],"answer":[3],"why":"The stated cardinality is one parent and many child rows.","explain":"1:N relates one account to multiple contacts; the inverse view is N:1.","kind":"single","difficulty":"Foundation"},{"id":"q32","topic":3,"question":"Students can enroll in many courses, and courses have many students. Which relationship?","options":["N:1","N:N","1:N","Parent-child business unit"],"answer":[1],"why":"Both sides can reference several rows, ruling out one-to-many cardinality.","explain":"N:N supports multiple related records on both sides, usually via an intersect relationship.","kind":"single","difficulty":"Foundation"},{"id":"q33","topic":3,"question":"Which side typically contains the lookup in an ordinary 1:N relationship?","options":["Both tables always require a duplicate lookup","Neither side stores a reference","The many/child side","The one/parent side only"],"answer":[2],"why":"A child row normally holds the foreign-key-like reference to its parent.","explain":"The N-side lookup points to the single related parent row.","kind":"single","difficulty":"Applied"},{"id":"q34","topic":3,"question":"Which parent-record operations can be configured for cascade behavior in relationships? Select ALL that apply.","options":["Reparent","Delete","Assign","Changing the user’s laptop wallpaper"],"answer":[0,1,2],"why":"Cascade settings govern related data operations, not local desktop preferences.","explain":"Relationship cascades include relevant actions such as Assign, Delete and Reparent.","kind":"multi","difficulty":"Applied"},{"id":"q35","topic":3,"question":"A Contact must not disappear when its Account is deleted. What design issue needs attention?","options":["Choice color palette","Formula column precision","Dashboard sorting order","Delete cascading behavior on the relationship"],"answer":[3],"why":"The risk involves referential behavior, not presentation or numerical precision.","explain":"Review delete behavior such as restrict or remove link according to business needs.","kind":"single","difficulty":"Advanced"},{"id":"q36","topic":3,"question":"What does a many-to-one (N:1) relationship represent?","options":["A separate relationship type unrelated to 1:N","Automatic data deduplication","The view from many child rows toward one parent row","A collection of unrelated choice values"],"answer":[2],"why":"N:1 and 1:N are opposite views of the same relationship.","explain":"For example, each Contact can look up to one parent Account.","kind":"single","difficulty":"Foundation"},{"id":"q37","topic":3,"question":"The N:1 view is the inverse perspective of a 1:N table relationship.","options":["True","False"],"answer":[0],"why":"The relationship can be described from either the parent or child direction.","explain":"N:1 from child to parent is the inverse perspective of 1:N from parent to children.","kind":"tf","difficulty":"Foundation"},{"id":"q38","topic":3,"question":"A lookup shows a selected record but users cannot assign it. What may be missing?","options":["A Word template","A Power BI premium workspace","A different chart theme","Append/Append To privileges and access"],"answer":[3],"why":"Linking records can require association privileges on the relevant tables/rows.","explain":"Check Append for the record being linked and Append To for the target, plus read/access requirements.","kind":"single","difficulty":"Applied"},{"id":"q39","topic":3,"question":"Which is a valid use for a self-referential relationship?","options":["A business rule granting every user admin","An Employee record referring to another Employee as manager","A Power BI report importing itself","A global Choice referencing itself as an API"],"answer":[1],"why":"The employee-manager hierarchy is a relationship within the same table.","explain":"A self-referential lookup supports hierarchical concepts such as managers or parent categories.","kind":"single","difficulty":"Applied"},{"id":"q40","topic":3,"question":"In an API response, a navigation property commonly represents what?","options":["The environment display theme","The user’s browser URL history","A relationship that can be traversed to associated records","A Dataverse license SKU"],"answer":[2],"why":"Navigation properties belong to the OData entity data model.","explain":"Use navigation properties and $expand to access related rows via the Web API.","kind":"single","difficulty":"Advanced"},{"id":"q41","topic":4,"question":"Which privilege is needed to change an existing row’s field values?","options":["Read","Append To","Write","Share"],"answer":[2],"why":"Read, Append To and Share do not themselves permit editing field values.","explain":"Write controls updating rows, subject to access depth and other applicable restrictions.","kind":"single","difficulty":"Foundation"},{"id":"q42","topic":4,"question":"Which are Dataverse security role privileges? Select ALL that apply.","options":["Share","Append To","Reset Microsoft Entra tenant password","Read"],"answer":[0,1,3],"why":"Tenant password resets are outside Dataverse table privilege definitions.","explain":"Read, Append To and Share are distinct Dataverse security privileges.","kind":"multi","difficulty":"Foundation"},{"id":"q43","topic":4,"question":"What does the User-level access depth generally cover on user/team-owned data?","options":["Every child business unit","Records accessible at personal/user depth, including owned/shared access","All organization rows","Only organization-owned configuration"],"answer":[1],"why":"User depth is not unrestricted organizational or hierarchy-level access.","explain":"User-level access includes own records and applicable shared/team accessible records.","kind":"single","difficulty":"Applied"},{"id":"q44","topic":4,"question":"What is the effect of assigning two security roles to the same user?","options":["Only the oldest role is active","Both roles are disabled","The role with fewer privileges always wins","Their allowed privileges are cumulative"],"answer":[3],"why":"Security roles do not normally use a deny-wins intersection model.","explain":"Effective privileges combine the grants supplied by assigned roles and applicable teams.","kind":"single","difficulty":"Applied"},{"id":"q45","topic":4,"question":"Which access level covers a business unit and its descendant business units?","options":["None","Parent:Child Business Unit","Business Unit only","User"],"answer":[1],"why":"BU-only access does not extend to child business units.","explain":"Parent:Child Business Unit depth includes the current unit and its subordinate units.","kind":"single","difficulty":"Advanced"},{"id":"q46","topic":4,"question":"How are organization-owned table privileges generally scoped?","options":["User vs team ownership only","One row per permission","Parent:child only","Organization or no access"],"answer":[3],"why":"Organization-owned rows do not use personal record ownership access-depth tiers.","explain":"For organization-owned tables, privileges are effectively organization-wide or not granted.","kind":"single","difficulty":"Foundation"},{"id":"q47","topic":4,"question":"What is the primary purpose of column-level security?","options":["Hide all apps from the navigation menu","Encrypt every API call with a new key","Restrict access to supported sensitive column values","Replace security roles entirely"],"answer":[2],"why":"Column security supplements roles rather than replacing them or controlling app navigation.","explain":"Column security profiles can restrict Read, Create or Update for protected columns.","kind":"single","difficulty":"Foundation"},{"id":"q48","topic":4,"question":"An owner team can do which of the following?","options":["Replace the root business unit","Own records and have security roles assigned","Only display dashboards","Remove all table security automatically"],"answer":[1],"why":"Owner teams participate in ownership and role security; other actions are unrelated.","explain":"Owner teams can own Dataverse rows and receive security roles for their members.","kind":"single","difficulty":"Applied"},{"id":"q49","topic":4,"question":"Privileges from multiple assigned Dataverse security roles are cumulative.","options":["True","False"],"answer":[0],"why":"Role grants combine rather than making the least-privileged role cancel the others.","explain":"Effective access uses the grants available through assigned roles and eligible teams.","kind":"tf","difficulty":"Applied"},{"id":"q50","topic":4,"question":"A user can open an app but sees “access denied” on its primary table. What should be checked first?","options":["The laptop screen size","The app wallpaper","Appropriate Dataverse security roles and table privileges","Whether the table is alphabetically first"],"answer":[2],"why":"App access alone is not the same as permission to read table data.","explain":"Verify assigned roles, table privileges, access depths and record access.","kind":"single","difficulty":"Advanced"},{"id":"q51","topic":5,"question":"What does a model-driven app primarily derive its interface from?","options":["Excel worksheet cell colors","Dataverse metadata, tables, forms and views","A mandatory hand-coded React layout","Azure VM resource tags"],"answer":[1],"why":"Model-driven UIs depend on configured Dataverse model metadata rather than manual pixel placement.","explain":"Forms, views and app navigation drive model-driven experiences.","kind":"single","difficulty":"Foundation"},{"id":"q52","topic":5,"question":"What is a Dataverse view used for?","options":["Permanently deleting rows that do not match","Defining a new licensing plan","Replacing record security","Selecting and presenting a filtered/sorted set of table rows"],"answer":[3],"why":"Views display record sets but do not change underlying security or delete excluded rows.","explain":"Views configure columns, filtering and sorting for lists.","kind":"single","difficulty":"Foundation"},{"id":"q53","topic":5,"question":"Which are commonly configurable components of a model-driven app? Select ALL that apply.","options":["Views","Forms","Physical Azure VM disks","Navigation"],"answer":[0,1,3],"why":"Azure disk resources do not configure the model-driven app interface.","explain":"Forms, views and navigation are core model-driven app components.","kind":"multi","difficulty":"Applied"},{"id":"q54","topic":5,"question":"What is a business process flow intended to guide?","options":["Users through business stages and steps","HTTP retries for API calls","Azure networking routing","Database physical file storage"],"answer":[0],"why":"BPFs organize user-facing business stages rather than infrastructure or network operations.","explain":"Business process flows guide users through consistent stages such as Qualify, Develop and Close.","kind":"single","difficulty":"Applied"},{"id":"q55","topic":5,"question":"Which app style offers more freeform layout control?","options":["Model-driven app only","Dataverse audit log","Canvas app","Security role editor"],"answer":[2],"why":"Canvas apps provide flexible custom screens whereas model-driven apps emphasize metadata.","explain":"Canvas apps offer finer layout control and can connect to Dataverse.","kind":"single","difficulty":"Advanced"},{"id":"q56","topic":5,"question":"Which property of model-driven forms affects user experience but does not itself grant data access?","options":["Row sharing access","Column security profile grants","Security role’s Read privilege","Visibility of a tab or section"],"answer":[3],"why":"Form visibility is not an authorization boundary.","explain":"Hidden form fields are not a substitute for Dataverse security controls.","kind":"single","difficulty":"Foundation"},{"id":"q57","topic":5,"question":"You need a mandatory value on every supported client and API create operation. What is the stronger first consideration?","options":["Add a dashboard notification only","Hide the control in one form","A server-enforced validation/requiredness approach","Use a colored label"],"answer":[2],"why":"UI-only hints cannot consistently validate API and alternate-client requests.","explain":"Use the relevant table-level required setting or server-side validation when enforcement is needed.","kind":"single","difficulty":"Foundation"},{"id":"q58","topic":5,"question":"Hiding a field on a model-driven app form prevents users from reading that field through the Dataverse API.","options":["True","False"],"answer":[1],"why":"Form visibility is a user-interface setting, not a security boundary.","explain":"Use table and supported column security to protect data independently of forms.","kind":"tf","difficulty":"Applied"},{"id":"q59","topic":5,"question":"A user cannot see a command in a model-driven app. Which is a plausible reason?","options":["A Power BI report theme","Command visibility rules or privileges","The computer’s default printer","A malformed Excel cell formula"],"answer":[1],"why":"Model-driven commands may depend on contextual visibility and permissions.","explain":"Check command configuration, app context and required privileges.","kind":"single","difficulty":"Applied"},{"id":"q60","topic":5,"question":"Where should durable server-side business logic normally live if it must run regardless of which app updates a row?","options":["Only in a single form’s JavaScript OnChange handler","A view’s display name","Table-level/business rule or supported server-side extension","A personal dashboard widget"],"answer":[2],"why":"Form-only client code is bypassed by integrations and other clients.","explain":"Use server-side business rules, plug-ins or appropriate platform automation for cross-client behavior.","kind":"single","difficulty":"Advanced"},{"id":"q61","topic":6,"question":"Which is the standard Dataverse Web API endpoint pattern?","options":["https://org.crm.dynamics.com/dataverse/v1/account.csv","https://org.crm.dynamics.com/api/data/v9.2/accounts","https://org.crm.dynamics.com/api/sql/accounts","https://org.crm.dynamics.com/graphql/accounts"],"answer":[1],"why":"The other endpoint shapes are not the standard Dataverse OData Web API resource format.","explain":"Web API uses an organization URL followed by /api/data/v9.2/ and an entity set name.","kind":"single","difficulty":"Foundation"},{"id":"q62","topic":6,"question":"Which HTTP methods are used in ordinary Dataverse Web API CRUD operations? Select ALL correct answers.","options":["GET","COMMIT","POST","PATCH"],"answer":[0,2,3],"why":"COMMIT is not a standard HTTP verb for Dataverse CRUD calls.","explain":"GET reads, POST creates and PATCH updates/upserts records; DELETE also removes records.","kind":"multi","difficulty":"Foundation"},{"id":"q63","topic":6,"question":"Which request queries only name and accountnumber from Accounts?","options":["GET /accounts?$filter=name,accountnumber","GET /accounts?$orderby=name,accountnumber","GET /accounts?$expand=name,accountnumber","GET /accounts?$select=name,accountnumber"],"answer":[3],"why":"Filtering, expansion and ordering do not select the returned column subset.","explain":"$select controls which columns are requested from the entity set.","kind":"single","difficulty":"Applied"},{"id":"q64","topic":6,"question":"Which query finds Accounts whose name is exactly Acme (illustrative value)?","options":["GET /accounts?$select=name eq 'Acme'","GET /accounts?$filter=name eq 'Acme'","GET /accounts?$orderby=name eq 'Acme'","GET /accounts?$top=name eq 'Acme'"],"answer":[1],"why":"$select, $top and $orderby serve different purposes from equality filtering.","explain":"$filter with OData eq is the query operator for an equality condition.","kind":"single","difficulty":"Applied"},{"id":"q65","topic":6,"question":"Which OData option requests related records inline with the main response?","options":["$expand","$count","$orderby","$top"],"answer":[0],"why":"The other options limit, count or sort rows instead of traversing relationships.","explain":"$expand uses a navigation property to include associated data.","kind":"single","difficulty":"Advanced"},{"id":"q66","topic":6,"question":"Which JSON property correctly links a Contact to an Account through its parentcustomerid_account navigation property?","options":["\"parentcustomerid_account@lookup\": \"/accounts(GUID)\"","\"parentcustomerid_account\": \"Acme\"","\"parentcustomerid_account@odata.bind\": \"/accounts(GUID)\"","\"accountname\": \"GUID\""],"answer":[2],"why":"Lookup association requires a navigation property and the supported OData bind annotation.","explain":"Use navigationProperty@odata.bind with the target entity set and record ID.","kind":"single","difficulty":"Foundation"},{"id":"q67","topic":6,"question":"The OData $expand query option can include related records through navigation properties.","options":["True","False"],"answer":[0],"why":"A navigation property represents a relationship, not an arbitrary display label.","explain":"$expand can retrieve related row data inline with the primary query response.","kind":"tf","difficulty":"Foundation"},{"id":"q68","topic":6,"question":"What does the If-Match: * header do on a PATCH upsert candidate?","options":["Disables auditing","Prevents creating a missing record, enforcing update-only","Fetches formatted values","Guarantees creation of a missing record"],"answer":[1],"why":"The header prevents an accidental create rather than forcing it.","explain":"If-Match: * makes PATCH update-only; missing records yield 404.","kind":"single","difficulty":"Applied"},{"id":"q69","topic":6,"question":"After an API request receives HTTP 429, what should the client honor?","options":["The last row’s owner ID","A fixed zero-delay loop","The app wallpaper setting","The Retry-After response header"],"answer":[3],"why":"Aggressive immediate retrying worsens throttling, and other values are irrelevant.","explain":"429 indicates throttling; pause based on Retry-After before retrying.","kind":"single","difficulty":"Applied"},{"id":"q70","topic":6,"question":"Which approach handles a multi-page OData response correctly?","options":["Replace $filter with $count","Assume a maximum of exactly 20 records","Repeat the first request unchanged forever","Follow @odata.nextLink until no next link remains"],"answer":[3],"why":"Page size is not a reliable entire-result count; restarting repeats the first page.","explain":"Follow the returned @odata.nextLink for subsequent result pages.","kind":"single","difficulty":"Advanced"},{"id":"q71","topic":7,"question":"Which plug-in stage is best for changing a row’s incoming field values before Dataverse writes it?","options":["A Power BI dataset refresh","PreValidation","PostOperation async only","PreOperation"],"answer":[3],"why":"PreOperation is the normal transaction stage for modifying incoming Target values.","explain":"PreOperation executes before the core operation within the transaction.","kind":"single","difficulty":"Foundation"},{"id":"q72","topic":7,"question":"Which are valid Dataverse plug-in pipeline stages? Select ALL correct answers.","options":["ClientRendering","PostOperation","PreOperation","PreValidation"],"answer":[1,2,3],"why":"ClientRendering is not a server plug-in registration stage.","explain":"The registered pipeline stages include PreValidation, PreOperation and PostOperation.","kind":"multi","difficulty":"Foundation"},{"id":"q73","topic":7,"question":"Which statement about asynchronous plug-in steps is correct?","options":["They can be registered in PostOperation","They always block users until completed","They replace table security","They are registered only in PreValidation"],"answer":[0],"why":"Async steps are queued after the core operation rather than being PreValidation steps.","explain":"Asynchronous plug-in steps use PostOperation and run through the async service.","kind":"single","difficulty":"Applied"},{"id":"q74","topic":7,"question":"What is the primary purpose of a pre-image in plug-in execution?","options":["Design command bar icons","Provide selected row values from before an operation","Generate a new security role","Store API access tokens"],"answer":[1],"why":"Entity images carry snapshots of data, not identity tokens or UI design.","explain":"Pre-images let code compare old values with incoming values, where supported.","kind":"single","difficulty":"Applied"},{"id":"q75","topic":7,"question":"What is the typical purpose of a post-image in a plug-in step?","options":["Bypass concurrency checks","Export a managed solution","Provide a snapshot of row values after the core operation","Replace the environment database"],"answer":[2],"why":"Post-images are row state snapshots, not database backups or ALM operations.","explain":"Post-images contain configured attributes after the operation for supported messages/stages.","kind":"single","difficulty":"Advanced"},{"id":"q76","topic":7,"question":"Which SDK interface is traditionally used for Dataverse Create, Retrieve, Update and Delete?","options":["IDataverseWebBrowser","IGraphSubscriptionOnly","IExcelWorkbook","IOrganizationService"],"answer":[3],"why":"Only IOrganizationService is a Dataverse CRUD service interface among these options.","explain":"The .NET SDK exposes core operations via IOrganizationService implementations.","kind":"single","difficulty":"Foundation"},{"id":"q77","topic":7,"question":"What is a common consequence of unnecessary row updates inside a PostOperation plug-in?","options":["They force all flows to stop","They turn security roles into queues","They can trigger additional Update events and recursion risk","They remove the table from the environment"],"answer":[2],"why":"PostOperation is after the operation, so an extra write can cause more events.","explain":"Avoid redundant updates; change Target attributes in PreOperation where appropriate.","kind":"single","difficulty":"Foundation"},{"id":"q78","topic":7,"question":"An asynchronous Dataverse plug-in step can be registered in the PreOperation stage.","options":["True","False"],"answer":[1],"why":"PreOperation is not a supported stage for asynchronous plug-in registration.","explain":"Asynchronous plug-in steps are supported in PostOperation.","kind":"tf","difficulty":"Applied"},{"id":"q79","topic":7,"question":"What is a Custom API in Dataverse?","options":["A replacement for all security roles","A custom operation/message callable by supported clients and extensions","A unique environment URL color scheme","A mandatory SQL stored procedure"],"answer":[1],"why":"Custom APIs expose an operation contract rather than change UI or database engines.","explain":"Custom APIs define reusable Dataverse operations with parameters and optional plug-in logic.","kind":"single","difficulty":"Applied"},{"id":"q80","topic":7,"question":"A synchronous plug-in throws an exception during a transaction. What commonly happens?","options":["The operation may fail and roll back","Only the form color changes","Every row in the tenant is permanently removed","The operation always succeeds without noticing"],"answer":[0],"why":"Synchronous failures can affect the initiating operation, unlike harmless UI changes.","explain":"An exception inside the transactional pipeline can cancel and roll back that transaction.","kind":"single","difficulty":"Advanced"},{"id":"q81","topic":8,"question":"Which Dataverse trigger starts a cloud flow based on create/update/delete events?","options":["When a desktop wallpaper changes","When an Excel tab is colored","When a row is added, modified or deleted","When a PDF opens locally"],"answer":[2],"why":"Only the Dataverse trigger is tied to table row events.","explain":"Use the Dataverse trigger and choose change type, table and scope as needed.","kind":"single","difficulty":"Foundation"},{"id":"q82","topic":8,"question":"Which practices help avoid unnecessary Dataverse-triggered flow executions? Select ALL correct answers.","options":["Filter attributes","Update the same row unconditionally every run","Trigger conditions","Check whether values really changed"],"answer":[0,2,3],"why":"Unconditional self-updates can trigger loops and extra runs.","explain":"Filtering, conditions and change checks help limit unintended executions.","kind":"multi","difficulty":"Foundation"},{"id":"q83","topic":8,"question":"A flow repeatedly updates a row and triggers itself. What design helps?","options":["Add conditions and only update when values actually need changing","Remove every view","Replace text columns with images","Increase the app icon size"],"answer":[0],"why":"Recursive triggering is caused by flow/write design, not presentation settings.","explain":"Use filtering, guard conditions or change-detection logic to prevent self-trigger loops.","kind":"single","difficulty":"Applied"},{"id":"q84","topic":8,"question":"For a short-lived single-row update, which standard Dataverse connector action is appropriate?","options":["Deploy Azure VMs","Run a report-only DAX query","Update a row","Create a Word theme"],"answer":[2],"why":"The required operation is updating a Dataverse record, not reporting or infrastructure.","explain":"Update a row changes selected fields on a record identified by its table and row ID.","kind":"single","difficulty":"Applied"},{"id":"q85","topic":8,"question":"Which authentication model is appropriate for unattended, app-to-app Dataverse integration?","options":["Shared personal password in JavaScript","Anonymous HTTPS calls","An Excel cell containing a password","Application registration/service principal with an application user and roles"],"answer":[3],"why":"Unattended integrations should use managed application identity rather than leaked credentials.","explain":"Register an app identity, configure the Dataverse application user and grant least-privilege roles.","kind":"single","difficulty":"Advanced"},{"id":"q86","topic":8,"question":"What is the purpose of a connection reference in solution-aware flows?","options":["Change the table primary key","Point a solution component to a connector connection in the target environment","Store every customer record","Provide user-level row ownership"],"answer":[1],"why":"Connection references configure connector bindings, not table data or record ownership.","explain":"They help solutions deploy flows while remapping connections in each environment.","kind":"single","difficulty":"Foundation"},{"id":"q87","topic":8,"question":"Which capability helps integrate rows using an ERP’s unique customer number when Dataverse GUIDs are unknown?","options":["Duplicating the name as primary GUID","Alternate key with appropriate upsert logic","Removing all indexes","Using a dashboard filter as a key"],"answer":[1],"why":"A display field or filter is not a reliable unique integration key.","explain":"Alternate keys support addressing/upserting rows using stable business identifiers.","kind":"single","difficulty":"Foundation"},{"id":"q88","topic":8,"question":"When should you generally use Power Automate instead of a synchronous plug-in?","options":["To replace every security role","For the fastest possible in-transaction field validation","For asynchronous cross-service workflow and approvals","To bypass Dataverse APIs"],"answer":[2],"why":"Synchronous validation belongs in the transactional data layer; cloud flows are async workflows.","explain":"Power Automate suits orchestration, notifications, connectors and approval processes.","kind":"single","difficulty":"Applied"},{"id":"q89","topic":8,"question":"The identity used by a Power Automate Dataverse connection can affect which records the flow may access.","options":["True","False"],"answer":[0],"why":"A flow does not automatically bypass permissions simply because it is automated.","explain":"Connection identities need suitable Dataverse roles and data privileges.","kind":"tf","difficulty":"Applied"},{"id":"q90","topic":8,"question":"Which practice is best for reliable bulk integration?","options":["Hard-code personal passwords in flow descriptions","Assume all APIs accept anonymous connections","Fire unlimited concurrent requests with no error handling","Use idempotent upserts, pagination, retries and monitoring"],"answer":[3],"why":"Unchecked parallel calls and secret exposure lead to failures and security risks.","explain":"Design for rate limiting, deduplication, pagination and recoverable retries.","kind":"single","difficulty":"Advanced"},{"id":"q91","topic":9,"question":"Which solution type is generally used for active development customizations?","options":["Virtual solution","Unmanaged","Managed only","Formula solution"],"answer":[1],"why":"Managed layers are generally used for controlled distribution to downstream environments.","explain":"Use unmanaged solutions for source development and export managed packages downstream.","kind":"single","difficulty":"Foundation"},{"id":"q92","topic":9,"question":"Which items are typically relevant to solution-aware environment deployment? Select ALL that apply.","options":["Environment variables","Managed solutions","Personal monitor brightness","Connection references"],"answer":[0,1,3],"why":"Monitor brightness has no role in solution deployment or runtime connection binding.","explain":"Solutions, connection references and environment variables support controlled ALM.","kind":"multi","difficulty":"Foundation"},{"id":"q93","topic":9,"question":"Why choose a custom solution publisher early?","options":["It encrypts every table automatically","It bypasses licensing","It defines the customization prefix and solution identity conventions","It grants all users admin rights"],"answer":[2],"why":"Publishers govern customization namespace, not authentication or encryption settings.","explain":"Use a consistent publisher/prefix for solution components and long-term ALM hygiene.","kind":"single","difficulty":"Applied"},{"id":"q94","topic":9,"question":"What can a Dataverse environment variable store for a solution?","options":["Environment-specific configuration such as endpoint URLs","A user password embedded in plain text as recommended practice","Every historical row","The complete security role hierarchy as one number"],"answer":[0],"why":"Environment variables configure deployments, not bulk data or unsafe plaintext secrets.","explain":"Environment variables parameterize settings that differ between dev, test and production.","kind":"single","difficulty":"Applied"},{"id":"q95","topic":9,"question":"Which statement describes managed solution layering?","options":["Managed layers disable environment variables","All managed solutions become a single editable unmanaged layer","The oldest managed layer always wins without exception","Higher managed layers can override or merge lower layers according to component semantics"],"answer":[3],"why":"The incorrect options ignore managed layer precedence and merge behavior.","explain":"Managed layering determines effective component configuration when several solutions extend it.","kind":"single","difficulty":"Advanced"},{"id":"q96","topic":9,"question":"An active unmanaged customization can override the intended result of an imported managed solution change.","options":["True","False"],"answer":[0],"why":"Unmanaged layers can sit above managed solution layers for component customizations.","explain":"Inspect solution layers when managed imports appear not to take effect.","kind":"tf","difficulty":"Foundation"},{"id":"q97","topic":9,"question":"What is a dependency when exporting or importing a solution?","options":["A component required by another component","The color of the environment banner","A mandatory browser extension","A database row’s email domain"],"answer":[0],"why":"Solution dependencies are component references, not arbitrary user or UI properties.","explain":"Include required dependencies or ensure they exist in the target environment.","kind":"single","difficulty":"Foundation"},{"id":"q98","topic":9,"question":"What is the typical purpose of a deployment pipeline?","options":["Replace the need for security reviews","Skip solution validation","Automate and govern promotions between development, test and production","Allow every user direct access to production customization"],"answer":[2],"why":"Pipelines coordinate release controls rather than remove validation and security needs.","explain":"Pipelines move solutions through staged environments with defined checks.","kind":"single","difficulty":"Applied"},{"id":"q99","topic":9,"question":"Which environment practice reduces production risk?","options":["Omit dependency checks","Share one admin password across environments","Apply all experimental schema changes directly in production","Test solution imports and integrations in a nonproduction environment"],"answer":[3],"why":"Direct production experimentation creates avoidable release risk.","explain":"Validate deployments, roles, connection references and regression tests before production.","kind":"single","difficulty":"Applied"},{"id":"q100","topic":9,"question":"What happens when a managed solution is uninstalled?","options":["It automatically deletes every environment in the tenant","It never affects runtime behavior","It turns every remaining solution unmanaged","Its managed components/layer can be removed, subject to dependencies and data implications"],"answer":[3],"why":"Uninstall can change effective managed components and may be blocked by dependencies.","explain":"Check dependencies and data impact; lower layers may become effective after uninstall.","kind":"single","difficulty":"Advanced"},{"id":"q101","topic":10,"question":"What is the purpose of enabling Dataverse auditing?","options":["Enable API calls without a token","Track configured data changes and access events where supported","Replace security roles","Back up the entire tenant on every edit"],"answer":[1],"why":"Auditing records supported changes; it is not a full backup or bypass mechanism.","explain":"Audit settings can capture who changed tracked data and when, within supported scope.","kind":"single","difficulty":"Foundation"},{"id":"q102","topic":10,"question":"A Dataverse Web API client receives HTTP 401. What is the most relevant first investigation?","options":["Whether the table view is sorted ascending","Authentication token validity and audience","Solution icon colors","The screen refresh rate"],"answer":[1],"why":"401 represents an authentication problem rather than sorting or layout.","explain":"Check bearer token, endpoint audience, identity and authorization configuration.","kind":"single","difficulty":"Foundation"},{"id":"q103","topic":10,"question":"What does HTTP 403 commonly suggest in an API integration?","options":["The server is necessarily down","Query pagination is complete","Authenticated identity lacks required authorization","The request is always syntactically invalid JSON"],"answer":[2],"why":"403 usually indicates forbidden access, not a connection outage or pagination state.","explain":"Verify privileges, application-user roles and access scope when authorization fails.","kind":"single","difficulty":"Applied"},{"id":"q104","topic":10,"question":"Which actions can improve Dataverse API query efficiency? Select ALL that apply.","options":["Handle pagination","Always expand all relationships","Use $select","Apply selective $filter"],"answer":[0,2,3],"why":"Unnecessary broad expansions increase payload and server processing.","explain":"Project required columns, filter results and page through data appropriately.","kind":"multi","difficulty":"Applied"},{"id":"q105","topic":10,"question":"A Dataverse API HTTP 429 response should be retried immediately with no delay.","options":["True","False"],"answer":[1],"why":"Immediate unrestricted retries can prolong service-protection throttling.","explain":"Respect Retry-After and reduce load or adjust concurrency.","kind":"tf","difficulty":"Advanced"},{"id":"q106","topic":10,"question":"What is the best response to persistent 429 errors in a high-throughput importer?","options":["Disable SSL on the client","Honor Retry-After and tune concurrency/request rate","Switch to manual form entry for all rows","Ignore the error and increase requests indefinitely"],"answer":[1],"why":"Increasing load without backoff sustains throttling; transport downgrade is unsafe.","explain":"Implement server-guided backoff and tune throughput for the environment.","kind":"single","difficulty":"Foundation"},{"id":"q107","topic":10,"question":"Which statement about a Dataverse audit log is accurate?","options":["Audit records are free of all retention and capacity implications","Audit automatically fixes incorrect values","Audit data should be monitored with retention/storage considerations","Audit is interchangeable with restore backup"],"answer":[2],"why":"Audit data adds operational/storage considerations and is not a rollback system.","explain":"Manage auditing scope and retention according to compliance and capacity needs.","kind":"single","difficulty":"Foundation"},{"id":"q108","topic":10,"question":"What should you check when a rollup total appears stale?","options":["The linked PowerPoint theme","The browser default zoom alone","Its last calculation and scheduled recalculation status","Only the app icon"],"answer":[2],"why":"Rollups can be asynchronous, so UI presentation alone does not explain staleness.","explain":"Investigate the rollup calculation jobs and refresh schedule or supported recalculation options.","kind":"single","difficulty":"Applied"},{"id":"q109","topic":10,"question":"Which built-in platform feature helps search across indexed Dataverse content in supported apps?","options":["Windows Explorer Search","Word spellcheck","Excel sheet protection","Dataverse search"],"answer":[3],"why":"General office and operating system search do not index Dataverse row data.","explain":"Dataverse search provides platform-backed search over enabled/searchable table data.","kind":"single","difficulty":"Applied"},{"id":"q110","topic":10,"question":"Why monitor Dataverse database, file and log capacity separately?","options":["Different storage categories contribute distinct capacity use and operational planning","All data is billed only as document page count","Capacity never changes","API throttling uses only screen pixels"],"answer":[0],"why":"Dataverse capacity includes separate data categories with differing consumption patterns.","explain":"Track database, file and log storage to plan capacity, retention and cleanup.","kind":"single","difficulty":"Advanced"},{"id":"q111","topic":11,"question":"A Canvas app displays a hidden field with salary, but users must not retrieve it via API. What is essential?","options":["Protect the column using appropriate Dataverse column security and roles","Hide the card on a Canvas screen only","Change the column to red","Rename the display label"],"answer":[0],"why":"Client-side hiding is not a server authorization control.","explain":"Enforce authorization at the Dataverse layer, including column profiles where supported.","kind":"single","difficulty":"Foundation"},{"id":"q112","topic":11,"question":"An integration updates an Account only if no other integration changed it since its last read. Which mechanism fits?","options":["A visual form business rule only","ETag optimistic concurrency with If-Match","A fixed sleep of one second","$orderby on modifiedon"],"answer":[1],"why":"Delays and sort order cannot ensure record version consistency.","explain":"Supply a previously read ETag in If-Match to reject stale writes with 412.","kind":"single","difficulty":"Foundation"},{"id":"q113","topic":11,"question":"You need fast synchronous validation before saving a critical invoice row, regardless of client. What fits best?","options":["Client-side form hiding only","A properly designed synchronous server-side plug-in or supported table validation","A once-a-night email flow","A Power BI report filter"],"answer":[1],"why":"A report, delayed flow or UI display rule cannot guarantee synchronous server validation.","explain":"Server-side synchronous logic can reject invalid operations in the execution pipeline.","kind":"single","difficulty":"Applied"},{"id":"q114","topic":11,"question":"Which approaches help protect sensitive Dataverse data? Select ALL correct answers.","options":["Hide a card only in a canvas app","Supported column security profiles","Least-privilege integration identities","Table/row security privileges"],"answer":[1,2,3],"why":"Client-side hiding does not prevent direct API or other-client access.","explain":"Enforce security through Dataverse privileges, protected columns and least-privilege identities.","kind":"multi","difficulty":"Applied"},{"id":"q115","topic":11,"question":"A lookup exists but an API payload uses the display label instead of its navigation property. What is the recommended fix?","options":["Put the display label in a new GUID column","Send a URL to a dashboard instead","Use the correct single-valued navigation property with @odata.bind","Disable all relationship metadata"],"answer":[2],"why":"A friendly label is not a reliable Web API relationship schema reference.","explain":"Find the exact navigation property from metadata and bind it to the target entity set.","kind":"single","difficulty":"Advanced"},{"id":"q116","topic":11,"question":"An ETag used with the If-Match header can help implement optimistic concurrency for Dataverse row updates.","options":["True","False"],"answer":[0],"why":"ETags compare versions; they are not merely presentation metadata.","explain":"A mismatched version can cause HTTP 412 rather than overwrite newer data.","kind":"tf","difficulty":"Foundation"},{"id":"q117","topic":11,"question":"Which HTTP response commonly indicates a concurrency precondition failed?","options":["201 Created","200 OK","412 Precondition Failed","301 Moved Permanently"],"answer":[2],"why":"Success and redirect status codes do not describe failed conditional writes.","explain":"412 commonly signals that an If-Match or If-None-Match condition was not met.","kind":"single","difficulty":"Foundation"},{"id":"q118","topic":11,"question":"When using the Web API, what is the difference between /accounts and /account in a basic standard-table query?","options":["/account is required for POST only","/accounts addresses only views","/accounts is the entity set path, while account is the singular logical table name","Both are always identical synonyms"],"answer":[2],"why":"The Web API uses entity set names, which are commonly plural for standard tables.","explain":"Check EntitySetName in metadata instead of guessing from the logical table name.","kind":"single","difficulty":"Applied"},{"id":"q119","topic":11,"question":"Which conditions are important when diagnosing a Dataverse API 403? Select ALL correct answers.","options":["Table Read privilege","Access depth and record ownership","Application user assigned roles","Display name of the app icon"],"answer":[0,1,2],"why":"An icon label does not determine whether the API caller may read records.","explain":"Check the identity’s Dataverse roles, privileges and effective row access.","kind":"multi","difficulty":"Applied"},{"id":"q120","topic":11,"question":"An API service principal can authenticate but cannot read a custom table. What is the likely next step?","options":["Assign the Dataverse application user a role with the required table privileges","Remove HTTPS encryption","Give the app a different display name only","Reboot the user’s browser"],"answer":[0],"why":"Authentication succeeds; authorization for the Dataverse application identity is separate.","explain":"Grant least-privilege security roles to the application user and verify access depth.","kind":"single","difficulty":"Advanced"}];
const TOPICS = [["Foundations & architecture","Dataverse architecture, records, environments, capabilities"],["Tables & table types","Standard, custom, virtual, elastic, activity and ownership"],["Columns & business logic","Data types, formulas, rollups, validation, keys"],["Relationships & data modeling","Lookups, relationship types, cascades and normalization"],["Security & access","Roles, teams, business units, access and column security"],["Apps & user experience","Forms, views, business process flows and app behavior"],["Web API & OData","Endpoints, queries, JSON, HTTP methods, authorization"],["SDK, plug-ins & extensibility","Pipeline stages, execution context, custom APIs"],["Power Automate & integrations","Triggers, connectors, flows, bulk integration"],["Solutions, ALM & governance","Managed layers, environments, deployment strategy"],["Operations, audit & performance","Monitoring, service limits, audit, search and capacity"],["Advanced scenarios & diagnosis","Enterprise troubleshooting and design decisions"]];
const SOURCES = [["Dataverse overview","https://learn.microsoft.com/en-us/power-apps/maker/data-platform/why-dataverse-overview"],["Table types","https://learn.microsoft.com/en-us/power-apps/maker/data-platform/types-of-entities"],["Security model","https://learn.microsoft.com/en-us/power-platform/admin/wp-security-cds"],["Security roles and privileges","https://learn.microsoft.com/en-us/power-platform/admin/security-roles-privileges"],["Business rules","https://learn.microsoft.com/en-us/power-apps/maker/data-platform/data-platform-create-business-rule"],["Alternate keys","https://learn.microsoft.com/en-us/power-apps/maker/data-platform/define-alternate-keys-reference-records"],["Web API OData queries","https://learn.microsoft.com/en-us/power-apps/developer/data-platform/webapi/query-data-web-api"],["Web API relationships","https://learn.microsoft.com/en-us/power-apps/developer/data-platform/webapi/associate-disassociate-entities-using-web-api"],["Conditional API requests","https://learn.microsoft.com/en-us/power-apps/developer/data-platform/webapi/perform-conditional-operations-using-web-api"],["Plug-in stages","https://learn.microsoft.com/en-us/power-apps/developer/data-platform/register-plug-in"],["Solutions and ALM","https://learn.microsoft.com/en-us/power-platform/alm/"],["API service limits","https://learn.microsoft.com/en-us/power-apps/developer/data-platform/api-limits"]];
const STORAGE_KEY='dv-mastery-2-day-120-v1';
const PER_DAY=60, TOTAL_SECONDS=120*60;
const DOCUMENTS_BY_TOPIC=[0,1,4,1,2,4,6,9,7,10,11,8];
const letter=i=>'ABCD'[i]||String(i+1);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inRange=(n,d)=>n>=d*PER_DAY && n<(d+1)*PER_DAY;
function initialState(){return {answers:{},drafts:{},bookmarks:[],mastered:[],retries:{},mode:'study',timers:[{elapsed:0,running:false,startedAt:null},{elapsed:0,running:false,startedAt:null}],position:[0,60]};}
function restore(){let init=initialState();try {const v=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');if(!v||typeof v!=='object')return init;let s={...init,...v};if(!Array.isArray(s.bookmarks))s.bookmarks=[];if(!Array.isArray(s.mastered))s.mastered=[];if(!Array.isArray(s.timers)||s.timers.length!==2)s.timers=init.timers;if(!Array.isArray(s.position)||s.position.length!==2)s.position=[0,60];if(!s.drafts||typeof s.drafts!=='object')s.drafts={};return s;}catch{return init;}}
let state=restore(),page='dashboard',activeDay=0,reviewFilter='all',retryOpen=null,retrySelected=[],toastTimeout=null;
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));}catch(e){toast('Browser storage unavailable; export your results to save a copy.');}}
function toast(msg){const el=$('toast');el.textContent=msg;el.classList.add('show');clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove('show'),3500);}
function correct(q,choice){return Array.isArray(choice)&&choice.length===q.answer.length&&choice.every(v=>q.answer.includes(v));}
function attempts(){return Object.keys(state.answers).filter(k=>Number.isInteger(+k)&&+k>=0&&+k<BANK.length);}
function wrongIds(){return attempts().map(k=>+k).filter(i=>!state.answers[i].correct);}
function score(ids=null){const keys=ids||attempts().map(Number);const done=keys.filter(i=>state.answers[i]);const good=done.filter(i=>state.answers[i].correct).length;return {done:done.length,good,wrong:done.length-good,accuracy:done.length?Math.round(100*good/done.length):0};}
function dayScore(day){return score([...Array(PER_DAY)].map((_,i)=>i+day*PER_DAY));}
function rem(day){const t=state.timers[day];let elapsed=Number(t.elapsed)||0;if(t.running&&t.startedAt) elapsed+=(Date.now()-t.startedAt)/1000;return Math.max(0,Math.ceil(TOTAL_SECONDS-elapsed));}
function formatTime(sec){return `${String(Math.floor(sec/3600)).padStart(2,'0')}:${String(Math.floor(sec%3600/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;}
function timerStart(day){let t=state.timers[day];if(rem(day)<=0){toast('The 2-hour session is complete. You can still practice and review.');return;}if(!t.running){t.running=true;t.startedAt=Date.now();save();render();toast(`Day ${day+1} focus timer running.`);}}
function timerPause(day){const t=state.timers[day];if(t.running){t.elapsed+=Math.max(0,(Date.now()-t.startedAt)/1000);t.running=false;t.startedAt=null;save();render();toast('Timer paused. Your progress is saved.');}}
function fmtPct(n,max){return Math.max(0,Math.min(100,Math.round(100*n/Math.max(max,1))));}
function updateChrome(){const a=score(),wrong=wrongIds().filter(i=>!state.mastered.includes(i)).length;$('sideProgress').textContent=`${a.done} / 120`;$('sideBar').style.width=`${fmtPct(a.done,120)}%`;$('wrongNav').textContent=wrong;const title={dashboard:'Learning dashboard',day:`Day ${activeDay+1} · ${activeDay?'Advanced':'Foundation'}`,missed:'Wrong-answer review',bookmarks:'Bookmarked questions',resources:'API quick reference'};$('topTitle').textContent=title[page]||'Dataverse Mastery';if(page==='day')$('headerTime').textContent=`${formatTime(rem(activeDay))} left`;else $('headerTime').textContent='2 days × 120 min';document.querySelectorAll('#nav button[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page && (page!=='day'||Number(b.dataset.day)===activeDay)));}
function nav(to,day=null){page=to;if(day!==null)activeDay=Number(day);retryOpen=null;retrySelected=[];$('sidebar').classList.remove('open');$('menuShade').classList.remove('visible');render();window.scrollTo({top:0,behavior:'instant'});}
function metric(label,n,foot){return `<div class="metric"><div class="metric-label">${esc(label)}</div><div class="metric-number">${n}</div><div class="metric-footer">${esc(foot)}</div></div>`;}
function tProgress(t){return BANK.filter(x=>x.topic===t && !!state.answers[BANK.indexOf(x)]).length;}

function answerHtml(q,selected,disabled=false,submitted=false){return `<div class="choice-list">${q.options.map((op,i)=>{const active=selected.includes(i),isGood=submitted&&q.answer.includes(i),bad=submitted&&active&&!q.answer.includes(i),code=/(GET\s|POST\s|PATCH\s|DELETE\s|@odata|\$select|\$filter|If-Match|\/accounts)/.test(op);return `<button type="button" class="choice ${active?'selected':''} ${isGood?'correct':''} ${bad?'incorrect':''}" data-action="choose" data-option="${i}" ${disabled?'disabled':''} aria-pressed="${active}"><span class="choice-key">${q.kind==='multi'?(active?'✓':'□'):letter(i)}</span><span class="choice-text ${code?'codeish':''}">${esc(op)}</span></button>`;}).join('')}</div>`;}
function answerText(q,arr){return arr&&arr.length?arr.map(i=>`${letter(i)}. ${q.options[i]}`).join(' · '):'—';}
function differenceText(q,selected){let extra=selected.filter(i=>!q.answer.includes(i)),missing=q.answer.filter(i=>!selected.includes(i));if(q.kind==='multi'){let bits=[];if(missing.length)bits.push('missing '+missing.map(letter).join(', '));if(extra.length)bits.push('extra '+extra.map(letter).join(', '));return `Your selection has ${bits.join(' and ')}. ${q.why}`;}return `You selected “${q.options[selected[0]]??'—'}”. ${q.why}`;}
function explanation(q,chosen,isCorrect){return `<div class="explanation ${isCorrect?'':'wrong'}" role="status"><div class="result-head">${isCorrect?'✓ Correct — well done':'✕ Incorrect — learn the distinction'}</div>${isCorrect?`<p class="explanation-line"><strong>Why:</strong> ${esc(q.explain)}</p>`:`<p class="explanation-line"><strong>1 · Why your answer is wrong:</strong> ${esc(differenceText(q,chosen))}</p><p class="explanation-line"><strong>2 · Correct answer:</strong> ${esc(answerText(q,q.answer))}. ${esc(q.explain)}</p>`}</div>`;}

function sanitizeImport(raw){
  if(!raw||raw.app!=='Dataverse Mastery'||raw.totalQuestions!==120||!raw.progress||typeof raw.progress!=='object')throw Error('This is not a Dataverse Mastery progress export.');
  const incoming=raw.progress,clean=initialState();
  if(incoming.answers&&typeof incoming.answers==='object')for(const [key,value] of Object.entries(incoming.answers)){
    const idx=Number(key);if(!Number.isInteger(idx)||idx<0||idx>=120||!value||!Array.isArray(value.chosen))continue;
    const chosen=value.chosen.filter(n=>Number.isInteger(n)&&n>=0&&n<BANK[idx].options.length);
    if(!chosen.length)continue;
    clean.answers[idx]={chosen:[...new Set(chosen)],correct:correct(BANK[idx],chosen),at:Number(value.at)||Date.now()};
  }
  clean.bookmarks=Array.isArray(incoming.bookmarks)?[...new Set(incoming.bookmarks.filter(n=>Number.isInteger(n)&&n>=0&&n<120))]:[];
  clean.mastered=Array.isArray(incoming.mastered)?[...new Set(incoming.mastered.filter(n=>Number.isInteger(n)&&n>=0&&n<120&&!clean.answers[n]?.correct))]:[];
  clean.mode=incoming.mode==='exam'?'exam':'study';
  clean.position=Array.isArray(incoming.position)&&incoming.position.length===2?incoming.position.map((n,d)=>Number.isInteger(n)&&inRange(n,d)?n:d*60):[0,60];
  clean.timers=Array.isArray(incoming.timers)&&incoming.timers.length===2?incoming.timers.map(t=>({elapsed:Math.max(0,Math.min(TOTAL_SECONDS,Number(t.elapsed)||0)),running:false,startedAt:null})):[{elapsed:0,running:false,startedAt:null},{elapsed:0,running:false,startedAt:null}];
  return clean;
}
function exportJson(){const payload={app:'Dataverse Mastery',version:1,exportedAt:new Date().toISOString(),totalQuestions:BANK.length,progress:state,summary:{overall:score(),day1:dayScore(0),day2:dayScore(1)}};exportFile('dataverse-mastery-progress.json',JSON.stringify(payload,null,2),'application/json');toast('JSON progress export created.');}
function exportCsv(){const rows=[['Question #','Day','Topic','Question','Your first answer','Correct answer','Why it was wrong','Explanation','Mastered']];wrongIds().forEach(i=>{const q=BANK[i],a=state.answers[i];rows.push([i+1,Math.floor(i/60)+1,TOPICS[q.topic][0],q.question,answerText(q,a.chosen),answerText(q,q.answer),differenceText(q,a.chosen),q.explain,state.mastered.includes(i)?'Yes':'No']);});const csv=rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');exportFile('dataverse-wrong-answer-review.csv','\uFEFF'+csv,'text/csv;charset=utf-8');toast('Wrong-answer CSV exported.');}
function resetAll(){if(!confirm('Erase all saved answers, timers, bookmarks and review progress in this browser?'))return;state=initialState();page='dashboard';activeDay=0;save();render();toast('Progress reset.');}
document.addEventListener('click',evt=>{const b=evt.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;if(b.disabled)return;switch(action){case 'toggle-menu':$('sidebar').classList.toggle('open');$('menuShade').classList.toggle('visible');break;case 'close-menu':$('sidebar').classList.remove('open');$('menuShade').classList.remove('visible');break;case 'nav':nav(b.dataset.page,b.dataset.day??null);break;case 'start-timer':timerStart(activeDay);break;case 'pause-timer':timerPause(activeDay);break;case 'next-unanswered':nextUnanswered();break;case 'jump-topic':jumpTopic(Number(b.dataset.topic));break;case 'choose':changeChoice(Number(b.dataset.option));break;case 'submit':submit();break;case 'next':shiftQuestion(1);break;case 'previous':shiftQuestion(-1);break;case 'bookmark':bookmark(Number(b.dataset.q));break;case 'mode':state.mode=b.dataset.mode;save();render();break;case 'filter':reviewFilter=b.dataset.filter;retryOpen=null;render();break;case 'retry':{const idx=Number(b.dataset.q);retryOpen=retryOpen===idx?null:idx;retrySelected=[];render();break;}case 'retry-submit':reviewRetrySubmit();break;case 'master':{const idx=Number(b.dataset.q);state.mastered=state.mastered.includes(idx)?state.mastered.filter(i=>i!==idx):[...state.mastered,idx];save();render();break;}case 'go-question':{const idx=Number(b.dataset.q),day=Math.floor(idx/60);state.position[day]=idx;save();nav('day',day);break;}case 'export-json':exportJson();break;case 'import-json':$('importFile').click();break;case 'export-csv':exportCsv();break;case 'reset':resetAll();break;}});
$('importFile').addEventListener('change',async evt=>{
  const file=evt.target.files&&evt.target.files[0];if(!file)return;
  try{const raw=JSON.parse(await file.text());const imported=sanitizeImport(raw);
    if(!confirm('Replace current quiz progress with the selected backup?'))return;
    state=imported;page='dashboard';activeDay=0;save();render();toast('Saved progress imported successfully.');
  }catch(err){toast('Could not import this JSON file: '+err.message);}
  finally{evt.target.value='';}
});
document.addEventListener('keydown',evt=>{if(evt.altKey||evt.ctrlKey||evt.metaKey||evt.target.matches('input, textarea, select, [contenteditable]'))return;if((page==='day'&& !state.answers[state.position[activeDay]])||(page==='missed'&&retryOpen!==null)){if(['1','2','3','4'].includes(evt.key)){const idx=page==='day'?state.position[activeDay]:retryOpen,q=BANK[idx],n=Number(evt.key)-1;if(n<q.options.length){changeChoice(n);evt.preventDefault();}}}if(page==='day'&&evt.key==='Enter'){evt.preventDefault();if(state.answers[state.position[activeDay]])shiftQuestion(1);else submit();}});
setInterval(()=>{const before=state.timers.map((_,d)=>rem(d));for(let d=0;d<2;d++){if(before[d]===0&&state.timers[d].running){state.timers[d].running=false;state.timers[d].elapsed=TOTAL_SECONDS;state.timers[d].startedAt=null;save();toast(`Day ${d+1} timebox completed — you can continue untimed.`);}}if(page==='day'){const t=$('dayTimer');if(t)t.textContent=formatTime(rem(activeDay));$('headerTime').textContent=`${formatTime(rem(activeDay))} left`;}},1000);
window.addEventListener('pagehide',()=>{for(const t of state.timers){if(t.running){t.elapsed+=Math.max(0,(Date.now()-t.startedAt)/1000);t.running=false;t.startedAt=null;}}save();});
render();
</script>
</body>
</html>
